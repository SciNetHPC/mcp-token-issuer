name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned so the scan is reproducible.  GitHub's native secret scanning
      # and push protection should also be enabled in the repository settings;
      # this job is the check that runs on every change.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o "/tmp/gitleaks_${version}_linux_x64.tar.gz" "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.sha256 "${base}/gitleaks_${version}_checksums.txt"
          ( cd /tmp && grep "gitleaks_${version}_linux_x64.tar.gz$" gitleaks.sha256 | sha256sum -c - )
          tar -xzf "/tmp/gitleaks_${version}_linux_x64.tar.gz" -C /tmp gitleaks

      - name: Scan history
        run: /tmp/gitleaks git . --no-banner --redact
